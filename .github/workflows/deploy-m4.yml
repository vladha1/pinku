name: Deploy to M4

on:
  push:
    branches:
      - claude/pinky-sensitivity-responsiveness-ywYNp
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Pull latest code
        run: |
          cd ~/pinku
          git fetch origin
          git pull origin ${{ github.ref_name }}

      - name: Stop Pinku and clear port 5100
        run: |
          pm2 stop pinku || true
          sleep 5
          lsof -ti :5100 | xargs kill -9 2>/dev/null || true

      - name: Start Pinku via PM2
        run: pm2 start pinku

      - name: Wait for startup
        run: sleep 12

      - name: Verify new code is serving
        run: |
          echo "=== What process holds port 5100 ==="
          lsof -i :5100 -n -P || echo "(lsof failed)"
          echo ""
          echo "=== dashboard.py has new code? ==="
          grep -c "slice(0,3)" ~/pinku/dashboard.py && echo "YES new code" || echo "NO old code"
          echo ""
          echo "=== Flask serving check ==="
          curl -s http://localhost:5100/ | grep -o ', Mon' | head -3 || echo "(curl failed or no Mon)"

      - name: Capture logs
        run: |
          echo "=== PM2 status ==="
          pm2 list --no-color
          echo ""
          echo "=== Pinku logs (last 50 lines) ==="
          pm2 logs pinku --lines 50 --nostream --no-color
