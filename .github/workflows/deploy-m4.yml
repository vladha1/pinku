name: Deploy to M4

on:
  push:
    branches:
      - claude/pinky-sensitivity-responsiveness-ywYNp
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Pull latest code
        run: |
          cd ~/pinku
          git fetch origin
          git pull origin ${{ github.ref_name }}

      - name: Restart Pinku via PM2
        run: pm2 restart pinku

      - name: Wait for startup
        run: sleep 6

      - name: Verify dashboard.py on disk
        run: |
          echo "=== What process holds port 5100 ==="
          lsof -i :5100 -n -P || echo "(lsof failed)"
          echo ""
          echo "=== Python sees new HTML? ==="
          /Users/vivekladha/pinku/.venv/bin/python3 -c "
import sys; sys.path.insert(0, '/Users/vivekladha/pinku')
import dashboard
print('Has Mon:', ', Mon' in dashboard.HTML or ', Tue' in dashboard.HTML)
print('Has slice:', 'slice(0,3)' in dashboard.HTML)
print('date-str font-size:', [l.strip() for l in dashboard.HTML.split('\n') if 'font-size' in l and 'date' in l.lower() or ('577' in l)])
" || echo "(python check failed)"
          echo ""
          echo "=== Flask serving check ==="
          curl -s http://localhost:5100/ | grep -o 'date-str[^<]*' | head -5 || echo "(curl failed)"

      - name: Capture logs
        run: |
          echo "=== PM2 status ==="
          pm2 list --no-color
          echo ""
          echo "=== Pinku logs (last 80 lines) ==="
          pm2 logs pinku --lines 80 --nostream --no-color
