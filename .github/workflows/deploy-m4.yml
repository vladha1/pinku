name: Deploy to M4

on:
  push:
    branches:
      - claude/pinky-sensitivity-responsiveness-ywYNp
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Pull latest code
        run: |
          cd ~/pinku
          git fetch origin
          git pull origin ${{ github.ref_name }}

      - name: Restart Pinku via PM2
        run: pm2 restart pinku

      - name: Wait for startup
        run: sleep 6

      - name: Verify dashboard.py on disk
        run: |
          echo "=== dashboard.py date-str CSS ==="
          grep -n "date-str\|day-name\|font-size\|color" ~/pinku/dashboard.py | head -20
          echo ""
          echo "=== dashboard.py HTML block ==="
          grep -n "date-str\|day-name" ~/pinku/dashboard.py
          echo ""
          echo "=== Flask serving check ==="
          curl -s http://localhost:5100/ | grep -o 'date-str[^<]*' | head -5 || echo "(curl failed)"

      - name: Capture logs
        run: |
          echo "=== PM2 status ==="
          pm2 list --no-color
          echo ""
          echo "=== Pinku logs (last 80 lines) ==="
          pm2 logs pinku --lines 80 --nostream --no-color
