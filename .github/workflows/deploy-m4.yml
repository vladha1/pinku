name: Deploy to M4

# Manual only. Deploys normally go through the `deploy pinku` command on dev.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Pull latest code
        run: |
          cd ~/pinku
          # Refuse to deploy over uncommitted prod edits instead of wiping them.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Prod has uncommitted edits — commit them to git first." >&2
            git status --short --untracked-files=no >&2
            exit 1
          fi
          git fetch origin
          git checkout ${{ github.ref_name }}
          git merge --ff-only origin/${{ github.ref_name }}

      - name: Run wake word tests
        run: |
          cd ~/pinku
          python3 test_wake.py -v

      - name: Restart Pinku with new code
        run: |
          # Kill pinku.py — start_pinku.command's while-loop restarts it
          # automatically with the freshly-pulled code after a 5s pause.
          # Do NOT use PM2 here; the user runs Pinku from Terminal for mic permissions.
          pkill -TERM -f "python.*pinku\.py" 2>/dev/null || true
          sleep 3
          pkill -9 -f "python.*pinku\.py" 2>/dev/null || true
          lsof -ti :5100 | xargs kill -9 2>/dev/null || true

      - name: Wait for auto-restart
        run: sleep 20

      - name: Verify new code is running
        run: |
          echo "=== Pinku process ==="
          pgrep -a -f "python.*pinku\.py" || echo "(not running)"
          echo ""
          echo "=== Flask serving check ==="
          curl -s http://localhost:5100/ | head -5 || echo "(curl failed)"
          echo ""
          echo "=== Recent Pinku logs ==="
          tail -20 ~/pinku/logs/pinku_$(date +%Y-%m-%d).log 2>/dev/null || echo "(no log yet)"
